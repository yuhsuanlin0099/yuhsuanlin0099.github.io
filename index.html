<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>嘉義互動字＋健身倒數＋小火車（持續變化啟動版）</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: radial-gradient(
          1200px 900px at 70% -10%,
          #162037 0%,
          #0c0f14 60%
        );
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      video {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view" aria-label="Chiayi"></canvas>
    <video id="cam" playsinline muted></video>
    <script>
      // ===== 基本 Canvas =====
      const cvs = document.getElementById("view");
      const ctx = cvs.getContext("2d");
      function fit() {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        cvs.width = Math.round(innerWidth * dpr);
        cvs.height = Math.round(innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      addEventListener(
        "resize",
        () => {
          fit();
          rasterizeText();
          makeTextParticles();
          resetTrain();
        },
        { passive: true }
      );
      fit();

      // ===== 粒子「嘉義」 =====
      const colors = [
        "#f9a8d4",
        "#fde68a",
        "#c7d2fe",
        "#99f6e4",
        "#fbcfe8",
        "#bfdbfe",
      ];
      let targets = [];
      let P = [];
      function rasterizeText() {
        const W = cvs.clientWidth,
          H = cvs.clientHeight;
        const text = "嘉義";
        const th = H * 0.74;
        const tw = Math.min(W * 0.86, th * 1.6);
        const off = document.createElement("canvas");
        off.width = tw | 0;
        off.height = th | 0;
        const o = off.getContext("2d");
        o.fillStyle = "#fff";
        o.textAlign = "center";
        o.textBaseline = "middle";
        o.font = `900 ${
          th * 0.78
        }px "Noto Sans TC","PingFang TC",system-ui,sans-serif`;
        o.fillText(text, off.width / 2, off.height / 2);
        const img = o.getImageData(0, 0, off.width, off.height).data;
        const pts = [];
        const gap = 4;
        for (let y = 0; y < off.height; y += gap) {
          for (let x = 0; x < off.width; x += gap) {
            if (img[(y * off.width + x) * 4 + 3] > 10) {
              pts.push({
                x: (W - off.width) / 2 + x,
                y: (H - off.height) / 2 + y,
              });
            }
          }
        }
        targets = pts;
      }
      function makeTextParticles() {
        P = new Array(targets.length);
        for (let i = 0; i < targets.length; i++) {
          const t = targets[i];
          P[i] = {
            x: Math.random() * cvs.clientWidth,
            y: Math.random() * cvs.clientHeight,
            vx: 0,
            vy: 0,
            tx: t.x,
            ty: t.y,
            r: 1.6 + Math.random() * 1.4,
            c: colors[(Math.random() * colors.length) | 0],
            phx: Math.random() * Math.PI * 2,
            phy: Math.random() * Math.PI * 2,
            fx: 0.1 + Math.random() * 0.18,
            amp: 0.35 + Math.random() * 0.45,
          };
        }
      }
      rasterizeText();
      makeTextParticles();

      // ===== 低解析度動作偵測 =====
      const cam = document.getElementById("cam");
      const off = document.createElement("canvas");
      const M = {
        w: 96,
        h: 72,
        prev: null,
        L: { cx: null, cy: null, lastCx: null, vx: 0, lastT: 0 },
        R: { cx: null, cy: null, lastCx: null, vx: 0, lastT: 0 },
        activeNow: false,
      };
      off.width = M.w;
      off.height = M.h;
      let lastMotionT = performance.now();

      // —— 倒數「必須持續變化」的門檻設定 ——
      const START_MS = 300; // 放超鬆：連續變化 0.3s 就能啟動
      const MIN_EN = 4; // 放超鬆：最低強度 4
      const DELTA_EN = 2; // 放超鬆：每幀變化量 2
      const STOP_GRACE_MS = 1200; // 放超鬆：停頓 1.2s 內不暫停 // 放寬，停頓0.8秒內不暫停 // 開始後若 0.5s 沒變化就暫停
      let preAccum = 0; // 變化累積計時
      let lastEnergy = 0; // 前一幀能量
      let stopGrace = 0; // 倒數持續寬限（沒有新變化就倒數歇停）

      async function startCam() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false,
          });
          cam.srcObject = stream;
          await cam.play();
          requestAnimationFrame(loopMotion);
        } catch (e) {
          console.warn("Camera permission required", e);
        }
      }
      startCam();

      function loopMotion() {
        const nowT = performance.now();
        let dtM = nowT - lastMotionT;
        if (!isFinite(dtM) || dtM > 200) dtM = 16;
        lastMotionT = nowT;
        const o = off.getContext("2d");
        o.drawImage(cam, 0, 0, M.w, M.h);
        const frame = o.getImageData(0, 0, M.w, M.h);
        if (!M.prev) {
          M.prev = frame;
          requestAnimationFrame(loopMotion);
          return;
        }
        const a = frame.data,
          b = M.prev.data;
        const thr = 10; // 再放寬感度 // 靈敏
        let sLx = 0,
          sLy = 0,
          nL = 0;
        let sRx = 0,
          sRy = 0,
          nR = 0;
        for (let i = 0; i < a.length; i += 4) {
          const dr = a[i] - b[i],
            dg = a[i + 1] - b[i + 1],
            db = a[i + 2] - b[i + 2];
          if (Math.abs(dr) + Math.abs(dg) + Math.abs(db) > thr) {
            const p = (i / 4) | 0;
            const x = p % M.w;
            const y = (p / M.w) | 0;
            if (x % 3 === 0 && y % 3 === 0) {
              if (x < M.w / 2) {
                sLx += x;
                sLy += y;
                nL++;
              } else {
                sRx += x;
                sRy += y;
                nR++;
              }
            }
          }
        }
        const now = performance.now();
        updateSide(M.L, nL, sLx, sLy, now);
        updateSide(M.R, nR, sRx, sRy, now);
        M.prev = frame;
        M.activeNow = nL + nR > 0;

        // ===== 倒數觸發條件：必須持續變化才開始 =====
        const energy = Math.abs(M.L.vx) + Math.abs(M.R.vx);
        const dE = Math.abs(energy - lastEnergy);
        lastEnergy = energy;

        const motionChange = M.activeNow && energy > MIN_EN && dE > DELTA_EN;
        if (motionChange) {
          preAccum = Math.min(START_MS, preAccum + dtM);
          stopGrace = STOP_GRACE_MS; // 每次變化刷新寬限
        } else {
          // 放很鬆：慢慢衰減，避免永遠卡在黃卻上不去
          preAccum = Math.max(0, preAccum - dtM * 0.2);
          if (stopGrace > 0) stopGrace -= dtM;
        }

        // 額外助力：當動作很大時（能量明顯高），幫你更快達到啟動門檻
        if (energy > MIN_EN * 2.2) {
          preAccum = Math.min(START_MS, preAccum + dtM * 0.7);
          stopGrace = Math.max(stopGrace, STOP_GRACE_MS * 0.6);
        }

        const ready = preAccum >= START_MS;
        // 狀態切換
        counting = ready && stopGrace > 0;

        // （可選超保險）若已接近門檻且最近仍有變化，直接允許倒數
        // if (!counting && preAccum > START_MS * 0.6 && stopGrace > STOP_GRACE_MS * 0.6) {
        //   counting = true;
        // }

        // 提示顏色：灰=無變化；黃=累積中；綠=倒數中
        if (counting) {
          window.__waving = "green";
        } else if (preAccum > 0) {
          window.__waving = "amber";
        } else {
          window.__waving = "gray";
        }

        requestAnimationFrame(loopMotion);
      }

      function updateSide(S, n, sx, sy, now) {
        const dt = S.lastT ? now - S.lastT : 16;
        S.lastT = now;
        if (n > 0) {
          const cx = sx / n,
            cy = sy / n;
          if (S.lastCx != null) {
            const vx = (cx - S.lastCx) / (dt / 1000);
            S.vx = 0.9 * S.vx + 0.1 * vx;
          }
          S.lastCx = cx;
          S.cx = cx;
          S.cy = cy;
        } else {
          S.vx *= 0.85;
        }
      }

      // ===== 小火車（左進右出；無軌道；輪子貼底） =====
      const train = {
        x: null,
        y: 0,
        speed: 140,
        wheelPhase: 0,
        cars: 3,
        wheelR: 10,
        bodyOffset: 12,
      };
      function resetTrain() {
        const W = cvs.clientWidth,
          H = cvs.clientHeight;
        train.x = -(80 + train.cars * 82) - 100; // 從畫面左外起跑
        train.y = H - train.wheelR; // 輪子貼著底邊
      }
      function drawLoco(x, y, phase) {
        ctx.save();
        // 車身與車頭
        ctx.fillStyle = "#d84b4b";
        ctx.fillRect(x, y - train.bodyOffset - 20, 80, 32);
        ctx.fillStyle = "#c73737";
        ctx.fillRect(x + 60, y - train.bodyOffset - 28, 20, 40);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x + 8, y - train.bodyOffset - 10, 40, 6);
        // 窗與頭燈
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.fillRect(x + 18, y - train.bodyOffset - 16, 18, 12);
        ctx.beginPath();
        ctx.arc(x + 72, y - train.bodyOffset - 16, 5, 0, Math.PI * 2);
        ctx.fill();
        // 煙囪與淡煙
        ctx.fillStyle = "#333";
        ctx.fillRect(x + 70, y - train.bodyOffset - 32, 8, 8);
        for (let i = 0; i < 3; i++) {
          const px = x + 74 + i * 10,
            py = y - train.bodyOffset - 36 - i * 6,
            pr = 4 + i * 3;
          ctx.beginPath();
          ctx.fillStyle = `rgba(255,255,255,0.25)`;
          ctx.arc(px, py, pr, 0, Math.PI * 2);
          ctx.fill();
        }
        // 輪子（貼底）
        for (let i = 0; i < 3; i++) {
          wheel(x + 15 + i * 26, y, train.wheelR, phase + i * 0.6);
        }
        // 連桿
        ctx.strokeStyle = "#555";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x + 15, y + Math.sin(phase) * 2);
        ctx.lineTo(x + 41, y + Math.sin(phase + 0.6) * 2);
        ctx.lineTo(x + 67, y + Math.sin(phase + 1.2) * 2);
        ctx.stroke();
        ctx.restore();
      }
      function drawCar(x, y, phase) {
        ctx.save();
        ctx.fillStyle = "#e97171";
        ctx.fillRect(x, y - train.bodyOffset - 16, 70, 28);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x + 8, y - train.bodyOffset - 8, 42, 6);
        for (let i = 0; i < 2; i++) {
          wheel(x + 18 + i * 28, y, train.wheelR - 1, phase + i * 0.7);
        }
        ctx.restore();
      }
      function wheel(cx, cy, r, phase) {
        ctx.save();
        ctx.fillStyle = "#222";
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#999";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + r * Math.cos(phase), cy + r * Math.sin(phase));
        ctx.stroke();
        ctx.restore();
      }
      function drawTrain(dt) {
        const W = cvs.clientWidth,
          H = cvs.clientHeight;
        if (train.x == null) resetTrain();
        if (trainRunning) {
          train.x += train.speed * (dt / 1000);
          train.wheelPhase += 6 * (dt / 1000);
          if (train.x > W + 100) {
            // 跑出畫面右側，結束此次
            trainRunning = false;
            resetTrain();
            countdownRem = GOAL_MS; // 火車跑完後重置倒數
            counting = false; // 等待下一次揮舞
            // 重置持續變化累積
            preAccum = 0;
            stopGrace = 0;
            lastEnergy = 0;
            window.__waving = "gray";
          }
        }
        // 貼地陰影
        ctx.save();
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.ellipse(train.x + 60, train.y - 4, 60, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 車輛繪製
        drawLoco(train.x, train.y, train.wheelPhase);
        for (let i = 1; i <= train.cars; i++)
          drawCar(train.x - i * 82, train.y, train.wheelPhase + i * 0.3);
      }

      // ===== 10 秒倒數（持續變化→開始；停滯→暫停；0 觸發火車） =====
      const GOAL_MS = 10000; // 10 秒
      let countdownRem = GOAL_MS; // 剩餘時間（ms）
      let counting = false; // 是否正在倒數（揮舞中且通過持續變化門檻）
      let trainRunning = false; // 火車是否正在跑
      function drawCountdown(dt) {
        if (counting && !trainRunning) {
          countdownRem = Math.max(0, countdownRem - dt);
        }
        const W = cvs.clientWidth,
          H = cvs.clientHeight;
        const cx = W * 0.5,
          cy = Math.max(H * 0.15, 90); // 上方置中
        const R = Math.min(W, H) * 0.08;
        // 背板圓
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, R + 12, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(15,23,42,0.35)";
        ctx.fill();
        // 底環
        ctx.strokeStyle = "rgba(148,163,184,0.25)";
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.stroke();
        // 進度弧
        const t = 1 - countdownRem / GOAL_MS;
        const start = -Math.PI / 2;
        const end = start + Math.PI * 2 * t;
        const grad = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
        grad.addColorStop(0, "#fbcfe8");
        grad.addColorStop(0.5, "#c7d2fe");
        grad.addColorStop(1, "#99f6e4");
        ctx.strokeStyle = grad;
        ctx.lineCap = "round";
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.arc(cx, cy, R, start, end);
        ctx.stroke();
        // 跳動光點
        const glowAng = end;
        const gx = cx + R * Math.cos(glowAng),
          gy = cy + R * Math.sin(glowAng);
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath();
        ctx.arc(gx, gy, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(gx, gy, 10, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.18)";
        ctx.fill();
        // 數字
        const secs = Math.ceil(countdownRem / 1000);
        ctx.fillStyle = "rgba(241,245,249,0.95)";
        ctx.font = `700 ${R * 0.9}px Inter, system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(secs.toString(), cx, cy + 1);
        ctx.restore();
        // 完成：啟動火車
        if (!trainRunning && countdownRem <= 0) {
          trainRunning = true;
        }
      }

      // ===== 主渲染迴圈 =====
      let last = performance.now();
      function step() {
        const now = performance.now();
        let dt = now - last;
        if (dt < 1000 / 55) {
          requestAnimationFrame(step);
          return;
        }
        last = now;
        fit();
        const W = cvs.clientWidth,
          H = cvs.clientHeight;
        ctx.clearRect(0, 0, W, H);
        // 背景微光
        const grd = ctx.createRadialGradient(
          W * 0.5,
          H * 0.5,
          10,
          W * 0.5,
          H * 0.5,
          Math.max(W, H) * 0.6
        );
        grd.addColorStop(0, "rgba(125,211,252,0.08)");
        grd.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, W, H);
        // 力場（鏡像 + 全域半徑 + 遠端基礎推力）
        const apply = (p, fx, fy, energy) => {
          const R = 0.9 * Math.max(W, H);
          const dx = p.x - fx,
            dy = p.y - fy;
          const d = Math.hypot(dx, dy) || 1;
          const e = Math.min(1, Math.abs(energy) / 100);
          const fall = Math.max(0, 1 - d / R);
          const base = 0.45;
          const f = (base + (1 - base) * fall) * (2.8 * (0.4 + 0.8 * e));
          p.vx += (dx / d) * f;
          p.vy += (dy / d) * f;
          p.vx += (0.22 * Math.max(-80, Math.min(80, energy))) / 80;
        };
        const energy = Math.abs(M.L.vx) + Math.abs(M.R.vx);
        if (M.L.cx != null) {
          let fx = (M.L.cx / (M.w / 2)) * (W / 2);
          fx = W - fx;
          const fy = M.L.cy != null ? (M.L.cy / M.h) * H : H * 0.5;
          for (let i = 0; i < P.length; i++) {
            apply(P[i], fx, fy, energy);
          }
        }
        if (M.R.cx != null) {
          const W2 = W / 2;
          let fx = (M.R.cx / (M.w / 2)) * W2 + W2;
          fx = W - fx;
          const fy = M.R.cy != null ? (M.R.cy / M.h) * H : H * 0.5;
          for (let i = 0; i < P.length; i++) {
            apply(P[i], fx, fy, energy);
          }
        }
        // 回位 + 微漂浮 + 繪製
        for (let i = 0; i < P.length; i++) {
          const p = P[i];
          p.vx += (p.tx - p.x) * 0.02;
          p.vy += (p.ty - p.y) * 0.02;
          p.vx *= 0.92;
          p.vy = p.vy * 0.92 + Math.sin(i + now * 0.002) * 0.02;
          p.x += p.vx;
          p.y += p.vy;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.c;
          ctx.fill();
        }
        // 倒數與小火車
        drawCountdown(dt);
        drawTrain(dt);
        // 偵測提示點（灰=無、黃=累積中、綠=倒數）
        ctx.save();
        const dotR = Math.max(6, Math.min(10, Math.min(W, H) * 0.008));
        ctx.globalAlpha = 0.7;
        ctx.fillStyle =
          window.__waving === "green"
            ? "#22c55e"
            : window.__waving === "amber"
            ? "#fbbf24"
            : "rgba(148,163,184,0.6)";
        ctx.beginPath();
        ctx.arc(W * 0.06, Math.max(H * 0.12, 70), dotR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    </script>
  </body>
</html>
