<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR 櫻花撥落｜上半身啟動（60 秒）</title>

    <!-- 只載一次：p5.js + ml5.js（ml5 0.12.2 內含 PoseNet/HandPose） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 實境相機背景（鏡像） -->
    <video id="camBg" autoplay playsinline webkit-playsinline muted></video>

    <!-- 除錯（D 鍵切換）與導引層（專門畫手掌圈等） -->
    <canvas id="debugCanvas"></canvas>
    <canvas id="guideCanvas"></canvas>

    <!-- 中央就緒提示（雙手舉過頭） -->
    <div id="readyWrap">
      <div id="readyRing" style="--deg: 0deg"></div>
      <div id="readyText">雙手高舉過頭 0.7 秒即可開始</div>
    </div>

    <!-- HUD（移除「命中」欄位） -->
    <div id="hud">
      <div id="status">狀態：啟動相機與模型…</div>
      <div>分數：<span id="score">0</span></div>
      <div>剩餘：<span id="timeLeft">60.0</span>s</div>
      <div>姿勢：<span id="poseStatus">—</span></div>
      <div>距離：<span id="distStatus">—</span></div>
    </div>
    <div id="message"></div>

    <!-- 櫻花與特效層 -->
    <div class="game-layer" id="gameLayer"></div>
    <div class="fx-layer" id="fxLayer"></div>

    <!-- 相機診斷（需要時看） -->
    <div id="camDiag" style="display: none">
      <div>Camera: <span id="camState">—</span></div>
      <div>Video: <span id="vidState">—</span></div>
      <div>Tracks: <span id="trkState">—</span></div>
      <div>Size: <span id="vidSize">—</span></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
